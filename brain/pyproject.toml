[project]
name = "mindcore"
version = "0.1.0"
description = "mind-core laptop brain: imports, downloads, transcription, extraction"
readme = "README.md"
authors = [
    { name = "Aman241104", email = "patelaman0241@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12==9.*",
    "trafilatura>=2.2.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
mindcore = "mindcore.cli:main"
